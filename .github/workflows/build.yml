name: Build Mawja

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches: [ main, design/glass-preview ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_RELEASE: ${{ inputs.build_type == 'release' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[play-release]')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.3.1

      - name: Decode keystore (release only)
        if: env.BUILD_RELEASE == 'true'
        env:
          MAWJA_KEYSTORE_BASE64: ${{ secrets.MAWJA_KEYSTORE_BASE64 }}
        run: |
          test -n "$MAWJA_KEYSTORE_BASE64" || { echo "::error::Missing MAWJA_KEYSTORE_BASE64"; exit 1; }
          umask 077
          printf '%s' "$MAWJA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mawja-upload.jks"

      - name: Build Debug APK
        if: env.BUILD_RELEASE != 'true'
        run: ./gradlew assembleDebug --stacktrace

      - name: Build signed release APK and AAB
        if: env.BUILD_RELEASE == 'true'
        env:
          MAWJA_KEYSTORE: ${{ runner.temp }}/mawja-upload.jks
          MAWJA_KEYSTORE_PASSWORD: ${{ secrets.MAWJA_KEYSTORE_PASSWORD }}
          MAWJA_KEY_ALIAS: ${{ secrets.MAWJA_KEY_ALIAS }}
          MAWJA_KEY_PASSWORD: ${{ secrets.MAWJA_KEY_PASSWORD }}
        run: |
          test -n "$MAWJA_KEYSTORE_PASSWORD" || { echo "Missing release keystore password"; exit 1; }
          test -f "$MAWJA_KEYSTORE" || { echo "Missing release keystore"; exit 1; }
          test -n "$MAWJA_KEY_ALIAS" || export MAWJA_KEY_ALIAS=mawjaUpload
          test -n "$MAWJA_KEY_PASSWORD" || export MAWJA_KEY_PASSWORD="$MAWJA_KEYSTORE_PASSWORD"
          ./gradlew assembleRelease bundleRelease --stacktrace
          bundle=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$bundle" | tee "$RUNNER_TEMP/mawja-bundle-verification.txt"
          grep -q '^jar verified' "$RUNNER_TEMP/mawja-bundle-verification.txt"
          wc -c "$bundle" app/build/outputs/apk/release/app-release.apk

      - name: Upload Debug APK
        if: env.BUILD_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Mawja-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK
        if: env.BUILD_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Mawja-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload signed Google Play bundle
        if: env.BUILD_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Mawja-Google-Play
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error
