name: Build Mawja

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches: [ main, design/glass-preview ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_RELEASE: ${{ inputs.build_type == 'release' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[play-release]')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.3.1

      - name: Decode keystore (release only)
        if: env.BUILD_RELEASE == 'true'
        env:
          MAWJA_KEYSTORE_BASE64: ${{ secrets.MAWJA_KEYSTORE_BASE64 }}
        run: |
          test -n "$MAWJA_KEYSTORE_BASE64" || { echo "::error::Missing MAWJA_KEYSTORE_BASE64"; exit 1; }
          umask 077
          printf '%s' "$MAWJA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mawja-upload.jks"

      - name: Build Debug APK
        if: env.BUILD_RELEASE != 'true'
        run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Build signed release APK and AAB
        if: env.BUILD_RELEASE == 'true'
        env:
          MAWJA_KEYSTORE: ${{ runner.temp }}/mawja-upload.jks
          MAWJA_KEYSTORE_PASSWORD: ${{ secrets.MAWJA_KEYSTORE_PASSWORD }}
          MAWJA_KEY_ALIAS: ${{ secrets.MAWJA_KEY_ALIAS }}
          MAWJA_KEY_PASSWORD: ${{ secrets.MAWJA_KEY_PASSWORD }}
        run: |
          test -n "$MAWJA_KEYSTORE_PASSWORD" || { echo "Missing release keystore password"; exit 1; }
          test -f "$MAWJA_KEYSTORE" || { echo "Missing release keystore"; exit 1; }
          test -n "$MAWJA_KEY_ALIAS" || export MAWJA_KEY_ALIAS=mawjaUpload
          test -n "$MAWJA_KEY_PASSWORD" || export MAWJA_KEY_PASSWORD="$MAWJA_KEYSTORE_PASSWORD"
          ./gradlew assembleRelease bundleRelease --stacktrace
          bundle=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$bundle" | tee "$RUNNER_TEMP/mawja-bundle-verification.txt"
          grep -q '^jar verified' "$RUNNER_TEMP/mawja-bundle-verification.txt"
          wc -c "$bundle" app/build/outputs/apk/release/app-release.apk

      - name: Upload Debug APK
        if: env.BUILD_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Mawja-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload playback test APK
        if: env.BUILD_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Mawja-playback-test
          path: app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 14

      - name: Upload Release APK
        if: env.BUILD_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Mawja-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload signed Google Play bundle
        if: env.BUILD_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Mawja-Google-Play
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

  runtime-profile:
    needs: build
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[profile-runtime]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Mawja-debug
          path: runtime-apk
      - uses: actions/download-artifact@v4
        with:
          name: Mawja-playback-test
          path: runtime-test-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Measure emulator memory and lifecycle stability
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install runtime-apk/*.apk
            adb install runtime-test-apk/*.apk
            mkdir -p runtime-report
            adb logcat -c
            adb shell am instrument -w -r -e class com.mawja.player.PlaybackRegressionTest,com.mawja.player.ThemeRegressionTest,com.mawja.player.CarRadioBrowserTest com.mawja.player.test/androidx.test.runner.AndroidJUnitRunner | tee runtime-report/runtime-instrumentation.txt
            adb logcat -d > runtime-report/playback-logcat.txt
            adb exec-out run-as com.mawja.player cat files/tv-audio-playback.txt > runtime-report/tv-audio-playback.txt
            ! grep -E 'FAILURES|INSTRUMENTATION_FAILED|shortMsg=' runtime-report/runtime-instrumentation.txt
            grep -q 'OK (3 tests)' runtime-report/runtime-instrumentation.txt

            adb exec-out run-as com.mawja.player cat files/theme-dark.png > runtime-report/theme-dark.png
            adb exec-out run-as com.mawja.player cat files/theme-light.png > runtime-report/theme-light.png
            python3 scripts/ui-refinement-smoke.py
            bash scripts/profile-runtime.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mawja-runtime-profile-emulator
          path: runtime-report/
          retention-days: 14
